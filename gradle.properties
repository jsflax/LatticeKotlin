kotlin.code.style=official
org.gradle.jvmargs=-Xmx2048m
org.gradle.parallel=true

# Enable cinterop commonization so nativeMain can use cinterop bindings
kotlin.mpp.enableCInteropCommonization=true

# The instrumented test suite pulls in androidx.test; the library itself has no
# support-library dependencies, so this only affects test artifacts.
android.useAndroidX=true
